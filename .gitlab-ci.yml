default:
  image: mcr.microsoft.com/dotnet/sdk:8.0

stages:
  - deploy

deploy:
  stage: deploy
  script:
    - dotnet nuget add source "${CI_API_V4_URL}/groups/$NUGET_GROUP_ID_RESUME_API/-/packages/nuget/index.json" --name GroupPackagesResume --username $GITLAB_USER_LOGIN --password $NUGET_AUTH_TOKEN --store-password-in-clear-text
    - dotnet nuget add source "${CI_API_V4_URL}/groups/$NUGET_GROUP_ID_BEANIESUTILITIES/-/packages/nuget/index.json" --name GroupPackagesBeanieUtilities --username $GITLAB_USER_LOGIN --password $NUGET_AUTH_TOKEN --store-password-in-clear-text
    - dotnet build -c Release
    - dotnet nuget add source "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/nuget/index.json" --name gitlab --username gitlab-ci-token --password $CI_JOB_TOKEN --store-password-in-clear-text
    - dotnet nuget push "SDK/bin/Release/*.nupkg" --source gitlab
    - dotnet nuget remove source GroupPackagesResume
    - dotnet nuget remove source GroupPackagesBeanieUtilities
  rules:
   - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  environment: production
